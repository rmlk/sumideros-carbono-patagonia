services:
  - type: web
    name: sumideros-carbono-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sumideros-carbono-db
          property: connectionString

databases:
  - name: sumideros-carbono-db
    plan: free
